openapi: 3.0.3
info:
  title: CourierMesh OTP API
  version: 1.1.0
  description: OTP-only self-hosted email dispatch. HTTP 202 means queued, not delivered.
servers:
  - url: https://gateway.example.com
security:
  - applicationToken: []
paths:
  /healthz:
    get:
      security: []
      summary: Service health
      responses:
        '200': {description: Healthy}
  /v1/send:
    post:
      summary: Queue one verification-code email
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 120}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpMessage'
            example:
              kind: otp
              from: no-reply@notify.example.com
              to: recipient@example.net
              code: '123456'
      responses:
        '202': {description: Queued}
        '400': {description: Invalid or non-OTP message}
        '401': {description: Invalid token}
        '403': {description: Sender not authorized}
        '409': {description: Idempotency conflict}
        '429': {description: Rate limited}
        '503': {description: Queue full}
  /v1/messages/{id}:
    get:
      summary: Get OTP delivery state
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Status returned}
        '404': {description: Not found or not owned by application}
components:
  securitySchemes:
    applicationToken:
      type: http
      scheme: bearer
      bearerFormat: KEY_ID.SECRET
  schemas:
    OtpMessage:
      type: object
      required: [from, to, code]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [otp]}
        from: {type: string, format: email}
        to: {type: string, format: email}
        code: {type: string, minLength: 4, maxLength: 24, pattern: '^[a-zA-Z0-9_-]+$'}
        variables:
          type: object
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: number}
